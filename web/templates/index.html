<!doctype html>
<html lang="en">
<head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>NSW GTFS Route Finder</title>
        <style>
                :root {
                        color-scheme: light dark;
                        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                }

                body {
                        margin: 0;
                        background: #f4f4f4;
                        min-height: 100vh;
                }

                main {
                        max-width: 720px;
                        margin: 0 auto;
                        padding: 2rem 1.5rem 4rem;
                }

                h1 {
                        font-size: 1.8rem;
                        margin-bottom: 1rem;
                }

                form {
                        background: white;
                        border-radius: 8px;
                        padding: 1.5rem;
                        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
                        margin-bottom: 2rem;
                }

                label {
                        display: block;
                        font-weight: 600;
                        margin-bottom: 0.4rem;
                }

                input[type="text"] {
                        width: 100%;
                        padding: 0.6rem 0.75rem;
                        font-size: 1rem;
                        border-radius: 6px;
                        border: 1px solid #ccc;
                        margin-bottom: 1.1rem;
                }

                button {
                        background: #00558b;
                        color: white;
                        border: none;
                        border-radius: 6px;
                        padding: 0.75rem 1.25rem;
                        cursor: pointer;
                        font-size: 1rem;
                        font-weight: 600;
                }

                button:disabled {
                        opacity: 0.6;
                        cursor: not-allowed;
                }

                #route-output ul {
                        list-style: none;
                        padding-left: 0;
                }

                #route-output li {
                        padding: 0.6rem 0.4rem;
                        border-bottom: 1px solid #ddd;
                }

                #message {
                        font-weight: 600;
                        margin-top: 1rem;
                }

                .hint {
                        margin-top: 0.5rem;
                        color: #444;
                        font-size: 0.9rem;
                }
        </style>
</head>
<body>
        <main>
                <h1>NSW GTFS Route Finder</h1>
                <p class="hint">Start typing a station name, choose from the suggestions, then create a route between the two.</p>

                <form id="route-form">
                        <label for="origin-input">Origin station</label>
                        <input id="origin-input" type="text" list="origin-options" placeholder="e.g. Central Station" autocomplete="off" />
                        <datalist id="origin-options"></datalist>

                        <label for="destination-input">Destination station</label>
                        <input id="destination-input" type="text" list="destination-options" placeholder="e.g. Parramatta Station" autocomplete="off" />
                        <datalist id="destination-options"></datalist>

                        <button type="submit" id="submit-btn">Find route</button>
                        <div id="message"></div>
                </form>

                <section id="route-output" hidden>
                        <h2>Route</h2>
                        <ul id="route-list"></ul>
                </section>
        </main>

        <script>
                const popularStops = {{ popular_stops|tojson }};

                const originInput = document.querySelector('#origin-input');
                const originDatalist = document.querySelector('#origin-options');
                const destinationInput = document.querySelector('#destination-input');
                const destinationDatalist = document.querySelector('#destination-options');
                const form = document.querySelector('#route-form');
                const messageEl = document.querySelector('#message');
                const routeSection = document.querySelector('#route-output');
                const routeList = document.querySelector('#route-list');
                const submitBtn = document.querySelector('#submit-btn');

                let selectedOrigin = null;
                let selectedDestination = null;

                function renderOptions(datalist, stops) {
                        datalist.innerHTML = '';
                        stops.forEach(stop => {
                                const option = document.createElement('option');
                                option.value = `${stop.stop_name} (${stop.stop_id})`;
                                option.dataset.stopId = stop.stop_id;
                                datalist.appendChild(option);
                        });
                }

                function findStopId(datalist, value) {
                        const options = Array.from(datalist.querySelectorAll('option'));
                        const match = options.find(option => option.value === value);
                        return match ? match.dataset.stopId : null;
                }

                function attachSearch(input, datalist, setSelected) {
                        input.addEventListener('input', async (event) => {
                                const value = event.target.value.trim();
                                const stopId = findStopId(datalist, value);
                                setSelected(stopId);

                                if (value.length < 2) {
                                        renderOptions(datalist, popularStops);
                                        return;
                                }

                                try {
                                        const response = await fetch(`/api/stops?query=${encodeURIComponent(value)}`);
                                        if (!response.ok) {
                                                throw new Error('Failed to load stops');
                                        }
                                        const data = await response.json();
                                        renderOptions(datalist, data.stops);
                                } catch (error) {
                                        console.error(error);
                                }
                        });

                        input.addEventListener('change', (event) => {
                                const stopId = findStopId(datalist, event.target.value.trim());
                                setSelected(stopId);
                        });

                        renderOptions(datalist, popularStops);
                }

                attachSearch(originInput, originDatalist, (stopId) => {
                        selectedOrigin = stopId;
                });

                attachSearch(destinationInput, destinationDatalist, (stopId) => {
                        selectedDestination = stopId;
                });

                form.addEventListener('submit', async (event) => {
                        event.preventDefault();
                        messageEl.textContent = '';
                        routeSection.hidden = true;

                        if (!selectedOrigin || !selectedDestination) {
                                messageEl.textContent = 'Please choose both an origin and a destination from the suggestions.';
                                return;
                        }

                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Searching…';

                        try {
                                const response = await fetch('/api/route', {
                                        method: 'POST',
                                        headers: {
                                                'Content-Type': 'application/json',
                                        },
                                        body: JSON.stringify({
                                                origin_stop_id: selectedOrigin,
                                                destination_stop_id: selectedDestination,
                                        }),
                                });

                                const payload = await response.json();
                                if (!response.ok) {
                                        messageEl.textContent = payload.error || 'No route found.';
                                        return;
                                }

                                routeList.innerHTML = '';
                                payload.stops.forEach((stop, index) => {
                                        const li = document.createElement('li');
                                        li.textContent = `${index + 1}. ${stop.stop_name} (${stop.stop_id})`;
                                        routeList.appendChild(li);
                                });

                                routeSection.hidden = false;
                        } catch (error) {
                                console.error(error);
                                messageEl.textContent = 'Something went wrong trying to build the route.';
                        } finally {
                                submitBtn.disabled = false;
                                submitBtn.textContent = 'Find route';
                        }
                });
        </script>
</body>
</html>
